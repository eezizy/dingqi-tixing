<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定时提醒</title>
<style>
  :root{
    --bg:#0b0f1a; --card-solid:#141b2e; --card2:#1b2440;
    --line:rgba(255,255,255,.09); --text:#eaf0ff; --muted:#9aa7c7;
    --brand:#6c8cff; --brand2:#36d6a0; --danger:#ff6b6b; --warn:#ffb454; --ok:#36d6a0;
    --radius:16px; --shadow:0 12px 34px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font-size:14px; line-height:1.55;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 620px at 8% -12%, rgba(108,140,255,.20), transparent 60%),
      radial-gradient(1000px 520px at 100% 0%, rgba(54,214,160,.13), transparent 55%),
      linear-gradient(180deg,#0b0f1a,#0a0e18);
    background-attachment:fixed; min-height:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:34px 18px 80px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(108,140,255,.4)}
  h1{font-size:22px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .tools{display:flex;gap:10px;align-items:center}
  .stats{color:var(--muted);font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px 13px;border-radius:999px}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;transition:.18s}
  .btn-primary{background:linear-gradient(135deg,var(--brand),#8aa2ff);color:#fff;box-shadow:0 8px 18px rgba(108,140,255,.35)}
  .btn-primary:hover{transform:translateY(-1px);filter:brightness(1.07)}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--brand);background:rgba(108,140,255,.12)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,.4)}
  .btn-danger:hover{background:rgba(255,107,107,.12)}

  .card{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);border-left:4px solid var(--brand);
    transition:transform .18s,border-color .18s;animation:rise .35s ease both}
  .card:hover{transform:translateY(-2px)}
  .card.off{opacity:.5;filter:grayscale(.4);border-left-color:var(--muted)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card-title{font-size:15.5px;font-weight:600;word-break:break-word}
  .card-content{color:var(--muted);white-space:pre-wrap;margin:8px 0 12px;font-size:13px;word-break:break-word}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .badge.wx{color:#7fe9c4;border-color:rgba(54,214,160,.35);background:rgba(54,214,160,.08)}
  .badge.mail{color:#ffc987;border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.08)}
  .badge.next{color:#aab8ff;border-color:rgba(108,140,255,.35);background:rgba(108,140,255,.10)}
  .badge.err{color:#ff9b9b;border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
  .actions{display:flex;gap:6px;flex-wrap:wrap}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--card-solid);
    border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .emo{font-size:48px;margin-bottom:10px}
  .empty .cta{margin-top:18px}

  .overlay{position:fixed;inset:0;background:rgba(5,8,15,.6);backdrop-filter:blur(4px);display:none;
    align-items:flex-start;justify-content:center;padding:42px 14px;overflow:auto;z-index:50}
  .overlay.show{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:linear-gradient(180deg,#161d31,#111829);border:1px solid var(--line);border-radius:18px;
    width:100%;max-width:540px;padding:24px;margin-top:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 16px;font-size:18px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,140,255,.18);background:rgba(108,140,255,.06)}
  textarea{resize:vertical;min-height:72px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .checks{display:flex;gap:18px;margin-top:8px}
  .checks label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;margin:0}
  .checks input{width:auto}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  .hidden{display:none!important}
  .help{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;margin-left:5px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1;cursor:help;position:relative;vertical-align:middle;transition:.15s}
  .help:hover,.help:focus{color:var(--brand);border-color:var(--brand);outline:none}
  .help::after{content:attr(data-tip);visibility:hidden;opacity:0;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px);width:250px;background:#0c1220;border:1px solid var(--line);color:var(--text);font-size:12px;line-height:1.55;padding:10px 12px;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:60;transition:.18s;pointer-events:none;text-align:left;white-space:normal;font-weight:400}
  .help:hover::after,.help:focus::after{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
    padding:11px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger);color:#ffd2d2}
  .toast.ok{border-color:var(--ok);color:#c8f5e4}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">⏰</div>
      <div>
        <h1>定时提醒</h1>
        <div class="sub" id="subline">Node.js 本地服务 · 企业微信 / 邮箱推送</div>
      </div>
    </div>
    <div class="tools">
      <span class="stats" id="stats"></span>
      <button class="btn-ghost" id="setBtn">⚙ 设置</button>
      <button class="btn-primary" id="addBtn">+ 添加提醒</button>
    </div>
  </header>
  <div id="list"></div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">添加提醒</h2>
    <input type="hidden" id="f_id">
    <label>标题 *</label>
    <input id="f_title" placeholder="例如：续签德国免费 VPS" maxlength="80">

    <label>提醒内容（可编辑，支持多行）</label>
    <textarea id="f_content" placeholder="例如：登录控制台，续签两台德国 IPv6 VPS，检查流量是否超限。"></textarea>

    <label>重复单位</label>
    <select id="f_unit">
      <option value="day">按天</option>
      <option value="month" selected>按月</option>
      <option value="year">按年</option>
    </select>

    <div class="row" id="row_interval">
      <div>
        <label>间隔（每 N 个周期）</label>
        <input id="f_interval" type="number" min="1" value="1">
      </div>
      <div id="col_dom">
        <label>每月几号</label>
        <input id="f_dom" type="number" min="1" max="31" value="27">
      </div>
      <div id="col_month" class="hidden">
        <label>月份</label>
        <input id="f_month" type="number" min="1" max="12" value="1">
      </div>
    </div>

    <label>提醒时间（时:分）</label>
    <div class="row">
      <input id="f_hour" type="number" min="0" max="23" value="9">
      <input id="f_minute" type="number" min="0" max="59" value="0">
    </div>

    <label>推送通道</label>
    <div class="checks">
      <label><input type="checkbox" id="f_wx" checked> 企业微信</label>
      <label><input type="checkbox" id="f_mail"> 邮箱</label>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 设置弹窗（填入自己的企业微信 / 邮箱凭证，开源友好） -->
<div class="overlay" id="setOverlay">
  <div class="modal">
    <h2>⚙ 推送设置</h2>
    <p class="hint">凭证保存在你自己的数据文件里（也可在服务器 .env 配置，前端填写优先）。管理页已受 Basic Auth 保护，请勿公开部署地址。</p>

    <div style="margin:0 0 12px;padding:10px 12px;background:rgba(122,140,255,.10);border:1px solid rgba(122,140,255,.25);border-radius:10px;color:var(--muted);font-size:12.5px;line-height:1.55">
      💡 企业微信 <b>Corpid</b> 与 <b>Resend Key</b> 可直接在此填写并保存；也可在服务器 <code>.env</code>（环境变量 <code>WX_CORPID</code> / <code>RESEND_API_KEY</code>）里配置，二者取并集（此处填写优先）。
    </div>

    <label>企业微信 Corpid <span class="help" tabindex="0" data-tip="企业微信管理后台「我的企业 → 企业信息」里的企业 ID（Corp ID），通常 ww 开头。">❓</span></label>
    <input id="s_corpid" placeholder="企业 ID（ww 开头）">

    <label>企业微信应用 Secret <span class="help" tabindex="0" data-tip="「应用管理 → 自建应用」里该应用的 Secret，用于获取 access_token，请注意保密。">❓</span></label>
    <input id="s_secret" type="password" placeholder="应用 Secret" autocomplete="off">

    <label>企业微信 AgentId <span class="help" tabindex="0" data-tip="自建应用的 AgentId，在应用详情页查看。">❓</span></label>
    <input id="s_agentid" placeholder="应用 AgentId">

    <label>接收人 UserID <span class="help" tabindex="0" data-tip="接收提醒的本人账号。在「通讯录」点开自己查看 UserID；手机端「我的 → 个人信息」也能看到。">❓</span></label>
    <input id="s_touser" placeholder="如 zhangsan">

    <label>Resend 邮件 API Key <span class="help" tabindex="0" data-tip="登录 Resend 后台 API Keys 页面生成（re_ 开头），免费额度足够个人使用。">❓</span></label>
    <input id="s_key" type="password" placeholder="re_xxxxxxxx" autocomplete="off">

    <label>发件地址 <span class="help" tabindex="0" data-tip="必须是你在 Resend 已验证域名下的邮箱（如 oncall@yourdomain.com），否则会被拒发。">❓</span></label>
    <input id="s_from" placeholder="domain 邮箱">

    <label>收件邮箱 <span class="help" tabindex="0" data-tip="实际接收提醒的邮箱，任意可用邮箱即可（如 Gmail）。">❓</span></label>
    <input id="s_to" placeholder="you@example.com">

    <label>时区 <span class="help" tabindex="0" data-tip="用于计算触发时刻，默认 Asia/Shanghai。填 IANA 时区名，如 America/New_York。">❓</span></label>
    <input id="s_tz" placeholder="Asia/Shanghai">

    <hr style="border:none;border-top:1px solid rgba(128,128,128,.3);margin:16px 0">

    <div style="font-weight:600;margin:6px 0">🔐 管理登录（网页直接改，无需重启）</div>
    <label>管理账号 <span class="help" tabindex="0" data-tip="用于登录本管理页（Basic Auth）。修改后立即生效，不需要重启服务。">❓</span></label>
    <input id="s_auth_user" placeholder="登录账号">

    <label>管理密码 <span class="help" tabindex="0" data-tip="用于登录本管理页。留空表示不修改（保留当前密码）；填写新密码即立即生效，无需重启。">❓</span></label>
    <input id="s_auth_pass" type="password" placeholder="留空则不修改" autocomplete="off">

    <div class="modal-actions">
      <button class="btn-ghost" id="setCancel">取消</button>
      <button class="btn-primary" id="setSave">保存设置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let TZ = 'Asia/Shanghai';
let reminders = [];

function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.className='toast', 2600);
}

async function api(path, opts){
  const res = await fetch(path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('请求失败 '+res.status));
  return data;
}

function fmt(epoch){
  if(!epoch) return '—';
  const d = new Date(epoch);
  return new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
}
function fmtFull(epoch){
  if(!epoch) return '—';
  const d = new Date(epoch);
  return new Intl.DateTimeFormat('zh-CN',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
}

function unitLabel(r){
  if(r.unit==='day') return `每 ${r.interval_num} 天`;
  if(r.unit==='month') return `每 ${r.interval_num} 个月 · ${r.day_of_month} 号`;
  return `每 ${r.interval_num} 年 · ${r.month}月${r.day_of_month}日`;
}

function render(){
  const list = $('list');
  if(!reminders.length){
    list.innerHTML = '<div class="empty"><div class="emo">🔔</div><div style="font-size:15px;color:var(--text)">还没有提醒</div><div style="font-size:13px;margin-top:4px">先去「⚙ 设置」填好推送账号，再点下面按钮创建第一条</div><div class="cta"><button class="btn-primary" id="emptyAdd">+ 创建第一条提醒</button></div></div>';
    $('stats').textContent = '';
    const ea = $('emptyAdd'); if(ea) ea.onclick = openAdd;
    return;
  }
  $('stats').textContent = `共 ${reminders.length} 条 · 启用 ${reminders.filter(r=>r.active).length} 条`;
  reminders.sort((a,b)=>(a.next_run||0)-(b.next_run||0));
  list.innerHTML = reminders.map(r=>{
    const badges = [];
    if(r.channel_wechat) badges.push('<span class="badge wx">💬 微信</span>');
    if(r.channel_email) badges.push('<span class="badge mail">✉️ 邮箱</span>');
    let nextBadge = `<span class="badge next">⏱ 下次 ${fmt(r.next_run)}</span>`;
    let errBadge = r.last_error ? `<span class="badge err" title="${escapeAttr(r.last_error)}">⚠ 上次推送异常</span>` : '';
    let lastBadge = r.last_sent ? `<span class="badge">上次 ${fmt(r.last_sent)}</span>` : '';
    return `<div class="card ${r.active?'':'off'}">
      <div class="card-top">
        <div class="card-title">${escapeHtml(r.title)}</div>
        <div class="actions">
          <button class="btn-ghost btn-sm" data-act="test" data-id="${r.id}">测试</button>
          <button class="btn-ghost btn-sm" data-act="edit" data-id="${r.id}">编辑</button>
          <button class="btn-ghost btn-sm" data-act="toggle" data-id="${r.id}">${r.active?'停用':'启用'}</button>
          <button class="btn-danger btn-sm" data-act="del" data-id="${r.id}">删除</button>
        </div>
      </div>
      ${r.content?`<div class="card-content">${escapeHtml(r.content)}</div>`:''}
      <div class="meta">
        <span class="badge">${unitLabel(r)} · ${String(r.hour).padStart(2,'0')}:${String(r.minute).padStart(2,'0')}</span>
        ${badges.join('')} ${nextBadge} ${lastBadge} ${errBadge}
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escapeAttr(s){return (s||'').replace(/"/g,'&quot;');}

function syncFormVisibility(){
  const u = $('f_unit').value;
  $('col_dom').classList.toggle('hidden', u==='day');
  $('col_month').classList.toggle('hidden', u!=='year');
}

async function load(){
  try{
    const cfg = await api('/api/config');
    TZ = cfg.tz || TZ;
    $('subline').textContent = `时区 ${TZ} · 服务器时间 ${fmtFull(cfg.serverNow)}`;
  }catch(e){}
  try{
    reminders = await api('/api/reminders');
    render();
  }catch(e){ toast('加载失败：'+e.message,'err'); }
}

function openAdd(){
  $('modalTitle').textContent='添加提醒';
  $('f_id').value='';
  $('f_title').value='';
  $('f_content').value='';
  $('f_unit').value='month';
  $('f_interval').value='1';
  $('f_dom').value='27';
  $('f_month').value='1';
  $('f_hour').value='9';
  $('f_minute').value='0';
  $('f_wx').checked=true;
  $('f_mail').checked=false;
  syncFormVisibility();
  $('overlay').classList.add('show');
}
function openEdit(r){
  $('modalTitle').textContent='编辑提醒';
  $('f_id').value=r.id;
  $('f_title').value=r.title;
  $('f_content').value=r.content||'';
  $('f_unit').value=r.unit;
  $('f_interval').value=r.interval_num;
  $('f_dom').value=r.day_of_month;
  $('f_month').value=r.month;
  $('f_hour').value=r.hour;
  $('f_minute').value=r.minute;
  $('f_wx').checked=!!r.channel_wechat;
  $('f_mail').checked=!!r.channel_email;
  syncFormVisibility();
  $('overlay').classList.add('show');
}

async function save(){
  const body = {
    title:$('f_title').value.trim(),
    content:$('f_content').value,
    unit:$('f_unit').value,
    interval_num:+$('f_interval').value||1,
    day_of_month:+$('f_dom').value||1,
    month:+$('f_month').value||1,
    hour:+$('f_hour').value||0,
    minute:+$('f_minute').value||0,
    channel_wechat:$('f_wx').checked,
    channel_email:$('f_mail').checked
  };
  if(!body.title){ toast('标题不能为空','err'); return; }
  const id = $('f_id').value;
  try{
    if(id){ await api('/api/reminders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/api/reminders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    $('overlay').classList.remove('show');
    await load();
    toast('已保存','ok');
  }catch(e){ toast('保存失败：'+e.message,'err'); }
}

async function onListClick(e){
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = +btn.dataset.id;
  const act = btn.dataset.act;
  const r = reminders.find(x=>x.id===id);
  try{
    if(act==='edit'){ openEdit(r); }
    else if(act==='test'){
      btn.disabled=true; btn.textContent='发送中…';
      const res = await api('/api/reminders/'+id+'/test',{method:'POST'});
      btn.disabled=false; btn.textContent='测试';
      if(res.ok) toast('已推送测试消息','ok');
      else toast('推送失败：'+(res.errs||[]).join('; '),'err');
      await load();
    }
    else if(act==='toggle'){
      const updated = {...r, active: r.active?0:1};
      const {title,content,unit,interval_num,day_of_month,month,hour,minute,channel_wechat,channel_email}=updated;
      await api('/api/reminders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content,unit,interval_num,day_of_month,month,hour,minute,channel_wechat,channel_email})});
      await load();
    }
    else if(act==='del'){
      if(!confirm('确定删除「'+r.title+'」？')) return;
      await api('/api/reminders/'+id,{method:'DELETE'});
      await load();
      toast('已删除','ok');
    }
  }catch(e){ toast(e.message,'err'); }
}

$('addBtn').onclick = openAdd;
$('cancelBtn').onclick = ()=> $('overlay').classList.remove('show');
$('saveBtn').onclick = save;
$('f_unit').onchange = syncFormVisibility;
$('list').addEventListener('click', onListClick);
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) $('overlay').classList.remove('show'); });

// 设置（填入自己的企业微信 / 邮箱凭证）
async function loadSettings(){
  try{
    const s = await api('/api/settings');
    $('s_corpid').value   = s.wx_corpid     || '';
    $('s_secret').value   = s.wx_corpsecret || '';
    $('s_agentid').value  = s.wx_agentid    || '';
    $('s_touser').value   = s.wx_touser     || '';
    $('s_key').value      = s.resend_key    || '';
    $('s_from').value     = s.email_from    || '';
    $('s_to').value       = s.email_to      || '';
    $('s_tz').value       = s.tz            || 'Asia/Shanghai';
    $('s_auth_user').value = s.auth_user    || '';
    const ready = s.wx_corpid || s.resend_key || s.wx_corpsecret || s.email_from;
    $('setBtn').textContent = ready ? '⚙ 设置✓' : '⚙ 设置';
  }catch(e){}
}
async function saveSettings(){
  const body = {
    wx_corpid:     $('s_corpid').value.trim(),
    wx_corpsecret: $('s_secret').value.trim(),
    wx_agentid:    $('s_agentid').value.trim(),
    wx_touser:     $('s_touser').value.trim(),
    resend_key:    $('s_key').value.trim(),
    email_from:    $('s_from').value.trim(),
    email_to:      $('s_to').value.trim(),
    tz:            $('s_tz').value.trim() || 'Asia/Shanghai',
    auth_user:     $('s_auth_user').value.trim(),
    auth_pass:     $('s_auth_pass').value
  };
  try{
    await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    $('setOverlay').classList.remove('show');
    await loadSettings();
    toast('设置已保存','ok');
  }catch(e){ toast('保存失败：'+e.message,'err'); }
}
$('setBtn').onclick = ()=>{ loadSettings(); $('setOverlay').classList.add('show'); };
$('setCancel').onclick = ()=> $('setOverlay').classList.remove('show');
$('setSave').onclick = saveSettings;
$('setOverlay').addEventListener('click', e=>{ if(e.target===$('setOverlay')) $('setOverlay').classList.remove('show'); });

load();
loadSettings();
</script>
